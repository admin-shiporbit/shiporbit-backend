spring:
  application:
    name: backend
#    Enable the H2 console for local dev
  datasource:
    url: jdbc:h2:mem:shiporbit;DB_CLOSE_DELAY=1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true
  sql:
    init:
      mode: always
server:
  port: 8080

logging:
  level:
    org.springframework.security: DEBUG

